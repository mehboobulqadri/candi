[package]
name = "candi-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "candi"
path = "src/main.rs"

[dependencies]
candi-cli = { path = "../candi-cli" }
candi-core = { path = "../candi-core" }
candi-pdf = { path = "../candi-pdf" }
candi-theme = { path = "../candi-theme" }
clap = { version = "4.5", features = ["derive"] }
egui_code_editor = { version = "=0.2.11", default-features = false }
eframe = { version = "0.30", default-features = true }
rfd = "0.15"

[dev-dependencies]
candi-core = { path = "../candi-core" }
