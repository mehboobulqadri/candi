[package]
name = "candi-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clean, minimal, distraction-free PDF reader"
repository = "https://github.com/mehboobulqadri/candi"

[[bin]]
name = "candi"
path = "src/main.rs"

[dependencies]
candi-cli = { path = "../candi-cli" }
candi-core = { path = "../candi-core" }
candi-pdf = { path = "../candi-pdf" }
candi-theme = { path = "../candi-theme" }
clap = { version = "4.5", features = ["derive"] }
egui_code_editor = { version = "=0.4.1", default-features = false }
eframe = { version = "0.30", default-features = true }
egui_extras = { version = "0.30", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde_json = "1"

[dev-dependencies]
candi-core = { path = "../candi-core" }
