[package]
name = "candi-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["mupdf-backend", "pdfium-backend"]
mupdf-backend = ["dep:mupdf"]
pdfium-backend = ["dep:pdfium-render"]

[dependencies]
mupdf = { version = "0.8.0", optional = true, features = ["base14-fonts"] }
pdfium-render = { version = "=0.8.37", optional = true, default-features = false, features = ["pdfium_latest", "thread_safe", "sync"] }

# Standalone measurement binary driven by bench/run.sh. harness=false so the
# built binary runs our main() instead of the libtest harness (which would
# otherwise run zero tests and exit 0 without measuring anything).
[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false
