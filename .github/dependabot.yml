version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One batched weekly PR instead of one PR per action bump.
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'