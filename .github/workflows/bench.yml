# Benchmarks on demand — fixtures-only CI run proves the harness still works,
# but numbers are only meaningful on a quiet machine, so it never runs per-push.
name: Bench

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: ./.github/actions/setup-pdfium
      # Fixtures-only: CI has no corpus-local.toml, so real books and fixture
      # generation are skipped loudly; the committed fixture must still run.
      - run: cargo build --release --benches
      - run: ./bench/run.sh --fixtures-only
