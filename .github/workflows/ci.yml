# Mirrors the drill's deterministic stages: fmt, clippy, tests.
# Local green = CI green — if the checks pass locally the PR is acceptable;
# CI exists to prove the same thing on GitHub, not to add new gates.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validates all workflow files so a syntax error fails loudly with the
      # actual error instead of silently scheduling zero jobs.
      - uses: raven-actions/actionlint@v2

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check

  rust-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # One entry per feature mode: default (both backends) and the
        # permissive pdfium-only build (zero AGPL third-party code). The empty
        # string keeps default features; the second entry drops them.
        features: ["", "--no-default-features --features pdfium-backend"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # mupdf (default-on via candi-pdf path deps) needs fontconfig.pc on Linux.
      # The pdfium-only matrix entry still unifies mupdf-backend through workspace
      # path dependencies that keep default features enabled.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config
      # Cache the cargo registry/git caches and the workspace target dir; keyed on
      # Cargo.lock so any dependency change invalidates the cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install libpdfium (chromium/7543, pdfium_7543)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          PDFIUM_CACHE="$HOME/.cache/candi-pdfium"
          PDFIUM_LIB_DIR="$PDFIUM_CACHE/chromium-7543"
          mkdir -p "$PDFIUM_CACHE"
          if [ ! -f "$PDFIUM_LIB_DIR/libpdfium.so" ]; then
            curl -fsSL -o "$PDFIUM_CACHE/pdfium-linux-x64.tgz" \
              "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7543/pdfium-linux-x64.tgz"
            tar xzf "$PDFIUM_CACHE/pdfium-linux-x64.tgz" -C "$PDFIUM_CACHE"
            mv "$PDFIUM_CACHE/lib" "$PDFIUM_LIB_DIR"
          fi
          echo "PDFIUM_LIB=$PDFIUM_LIB_DIR" >> "$GITHUB_ENV"
          echo "2383a414050dd21ae5300b119ad8a72360ef92cff820b4c685c047dc272c2794  $PDFIUM_LIB_DIR/libpdfium.so" | sha256sum -c -
      - name: Install libpdfium (chromium/7543, pdfium_7543)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PDFIUM_CACHE = Join-Path $env:USERPROFILE '.cache\candi-pdfium'
          $PDFIUM_LIB_DIR = Join-Path $PDFIUM_CACHE 'chromium-7543\bin'
          if (-not (Test-Path (Join-Path $PDFIUM_LIB_DIR 'pdfium.dll'))) {
            New-Item -ItemType Directory -Force -Path $PDFIUM_CACHE | Out-Null
            $tgz = Join-Path $PDFIUM_CACHE 'pdfium-win-x64.tgz'
            Invoke-WebRequest -Uri 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7543/pdfium-win-x64.tgz' -OutFile $tgz
            tar xzf $tgz -C $PDFIUM_CACHE
            New-Item -ItemType Directory -Force -Path (Join-Path $PDFIUM_CACHE 'chromium-7543') | Out-Null
            Move-Item (Join-Path $PDFIUM_CACHE 'bin') $PDFIUM_LIB_DIR
          }
          "PDFIUM_LIB=$PDFIUM_LIB_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $hash = (Get-FileHash (Join-Path $PDFIUM_LIB_DIR 'pdfium.dll') -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '6b963c2be9cacbaa0c0c7f4bf6d20d2fd16729ebdaa9989978b0f7b119c1c1cb') {
            throw "pdfium.dll sha256 mismatch: $hash"
          }
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo build --release ${{ matrix.features }}
      - run: cargo test --all-targets ${{ matrix.features }}

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install libpdfium (chromium/7543, pdfium_7543)
        run: |
          set -euo pipefail
          PDFIUM_CACHE="$HOME/.cache/candi-pdfium"
          PDFIUM_LIB_DIR="$PDFIUM_CACHE/chromium-7543"
          mkdir -p "$PDFIUM_CACHE"
          if [ ! -f "$PDFIUM_LIB_DIR/libpdfium.so" ]; then
            curl -fsSL -o "$PDFIUM_CACHE/pdfium-linux-x64.tgz" \
              "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7543/pdfium-linux-x64.tgz"
            tar xzf "$PDFIUM_CACHE/pdfium-linux-x64.tgz" -C "$PDFIUM_CACHE"
            mv "$PDFIUM_CACHE/lib" "$PDFIUM_LIB_DIR"
          fi
          echo "PDFIUM_LIB=$PDFIUM_LIB_DIR" >> "$GITHUB_ENV"
          echo "2383a414050dd21ae5300b119ad8a72360ef92cff820b4c685c047dc272c2794  $PDFIUM_LIB_DIR/libpdfium.so" | sha256sum -c -
      # Fixtures-only: CI has no corpus-local.toml, so real books and fixture
      # generation are skipped loudly; the committed fixture must still run.
      - run: cargo build --release --benches
      - run: ./bench/run.sh --fixtures-only

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject doc identity placeholders
        run: |
          if git grep -qE '\{\{(name|email|github|project|license)\}\}' -- README.md SECURITY.md LICENSE.md docs/; then
            echo "Tracked docs contain unfilled creds placeholders (run scripts/sync-creds.sh)"
            exit 1
          fi
      - name: Check relative markdown links
        run: |
          for f in README.md $(find docs -name '*.md'); do
            while read -r link; do
              case "$link" in
                http*|mailto*|*.html|*\#*) continue ;;
              esac
              target="$(dirname "$f")/$link"
              [ -e "$target" ] || { echo "broken link: $f -> $link"; exit 1; }
            done < <(grep -oE '\]\([^)]+\)' "$f" | sed 's/^](//; s/)$//')
          done
